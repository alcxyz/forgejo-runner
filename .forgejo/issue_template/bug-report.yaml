name: Bug report
description: Report a problem with this maintained runner distribution.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, [request private contact](https://git.alc.xyz/alcxyz/forgejo-runner/issues/new)
        using the Security contact request template, without publishing vulnerability details.
        For vulnerabilities also affecting unmodified upstream, follow the
        [upstream security policy](https://code.forgejo.org/forgejo/runner#reporting-security-vulnerabilities).
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Include expected behavior, actual behavior and minimal reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Runner and server versions
      description: Include the fork version suffix and container engine version if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove tokens, credentials and private job output before posting.
