name: Feature request
description: Discuss a change to this maintained runner distribution.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the use case and current behavior.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Describe the desired result and any compatibility constraints.
    validations:
      required: true
